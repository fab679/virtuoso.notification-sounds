# Which system events omarchy-sound-watch turns into Ocean sounds.
# Sourced as shell; 1 enables, 0 disables. Restart after editing:
#   systemctl --user restart omarchy-sound-watch

# AC adapter connected / disconnected -> power-plug / power-unplug
SOUND_POWER=1

# Battery full -> battery-full; battery at or below CRITICAL_PCT -> battery-caution
SOUND_BATTERY=1

# NetworkManager online / offline -> service-login / service-logout
# Set to 0 on a flaky wifi link, where this chimes more than it informs.
SOUND_NETWORK=1

# Bluetooth device connected / disconnected -> device-added / device-removed
SOUND_BLUETOOTH=1

# Threshold for the critical battery warning. Omarchy sends its own low-battery
# notification at 10%, which the shell plugin already sounds as battery-low, so
# keep this below that to avoid two warnings for one event.
CRITICAL_PCT=5

# Safety poll, in seconds. Each watcher blocks on its event source and only
# falls back to this interval, so a larger number costs nothing in latency.
POLL_SECONDS=30
